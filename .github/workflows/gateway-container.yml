# Copyright (c) 2026 sonde contributors
#
# Build and publish the sonde-gateway multi-arch container image to GHCR.
# Produces linux/amd64 and linux/arm64 images using native GitHub runners,
# then combines them into a single multi-arch manifest (GW-1800).
#
# Triggered by nightly-release.yml (workflow_call) and on release tags.
# Can also be run manually via workflow_dispatch.

name: Gateway Container

on:
  workflow_call:
    inputs:
      build_same_run_artifacts:
        description: Build supporting same-run artifacts for standalone execution.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build_same_run_artifacts:
        description: Build supporting same-run artifacts for standalone execution.
        required: false
        type: boolean
        default: true

concurrency:
  group: gateway-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alan-jowett/sonde-gateway

jobs:
  # Standalone dispatches do not have a caller workflow to provide same-run
  # modem artifacts, so build them here first. workflow_call executions expect
  # the caller to produce modem-firmware and modem-firmware-verbose in the same run.
  modem-firmware:
    if: inputs.build_same_run_artifacts
    name: Build modem firmware (same run)
    uses: ./.github/workflows/esp32-modem.yml

  # Standalone dispatches also need same-run compiled BPF test-program artifacts.
  # workflow_call executions expect the caller to upload a bpf-test-programs artifact.
  bpf-test-programs:
    if: inputs.build_same_run_artifacts
    name: Build BPF test programs (same run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make

      - name: Build BPF test programs
        run: make -C test-programs

      - name: Stage BPF test programs
        run: |
          mkdir -p artifact-staging
          cp test-programs/*.o artifact-staging/

      - name: Upload BPF test programs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bpf-test-programs
          path: artifact-staging/*
          if-no-files-found: error
          retention-days: 7

  # ── Per-architecture native builds ────────────────────────────────
  build:
    needs: [modem-firmware, bpf-test-programs]
    if: ${{ always() && (needs.modem-firmware.result == 'success' || needs.modem-firmware.result == 'skipped') && (needs.bpf-test-programs.result == 'success' || needs.bpf-test-programs.result == 'skipped') }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download default modem firmware artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: modem-firmware
          path: .artifacts/modem-firmware

      - name: Download verbose modem firmware artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: modem-firmware-verbose
          path: .artifacts/modem-firmware-verbose

      - name: Download BPF test-program artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpf-test-programs
          path: .artifacts/test-programs

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v3

      - name: Build container image
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: .github/docker/Dockerfile.gateway
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }}

      # Smoke tests: verify binaries exist and basic functionality works
      # before pushing (GW-1800, matches esp-dev-container pattern).
      - name: Smoke test — binary versions
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} --version
          docker run --rm --entrypoint sonde-admin ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} --version
          docker run --rm --entrypoint sonde-sht40-handler ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} --version
          docker run --rm --entrypoint sonde-tmp102-handler ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} --version
          docker run --rm --entrypoint espflash ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} --help
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
            'find /usr/local/share/sonde/test-programs -maxdepth 1 -name "*.o" | grep -q .'

      - name: Smoke test — runtime defaults
        run: |
          test "$(docker inspect -f '{{json .Config.Entrypoint}}' ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }})" = '["sonde-gateway"]'
          test "$(docker inspect -f '{{json .Config.Cmd}}' ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }})" = '["--db","/var/lib/sonde/sonde.db","--port","/dev/ttyACM0","--key-provider","env"]'
          docker run --rm ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} --help | grep -q -- '--key-provider'

      - name: Smoke test — static musl linkage
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
            'output="$(ldd /usr/local/bin/sonde-gateway 2>&1)"; \
             printf "%s\n" "$output"; \
             if printf "%s\n" "$output" | grep -Eiq "statically linked|not a dynamic executable|not a valid dynamic program"; then \
               exit 0; \
             fi; \
             lines="$(printf "%s\n" "$output" | grep -c .)"; \
             if [ "$lines" -eq 1 ] \
               && ! printf "%s\n" "$output" | grep -q "=>" \
               && printf "%s\n" "$output" | grep -Eq "^[[:space:]]*(/lib/)?ld-musl-[^[:space:]]+\\.so\\.1 \\(0x[0-9a-f]+\\)$"; then \
               exit 0; \
             fi; \
             exit 1'

      - name: Smoke test — non-root user and writable volume
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
            'whoami | grep -q sonde && touch /var/lib/sonde/test && rm /var/lib/sonde/test'

      - name: Smoke test — runtime directory writable by non-root user
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
            'whoami | grep -q sonde && touch /var/run/sonde/test && rm /var/run/sonde/test'

      - name: Smoke test — bundled modem images
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
            'test -r /usr/local/share/sonde/firmware/modem/default/flash_image.bin \
              && test -r /usr/local/share/sonde/firmware/modem/verbose/flash_image.bin'

      - name: Smoke test — bundled BPF test programs
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
            'test -d /usr/local/share/sonde/test-programs \
             && set -- /usr/local/share/sonde/test-programs/*.o \
             && test -e "$1" \
             && for f in "$@"; do test -r "$f"; done'

      - name: Smoke test — runtime image excludes Rust toolchain and source tree
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
            '! command -v cargo >/dev/null 2>&1 \
             && ! command -v rustc >/dev/null 2>&1 \
             && ! test -d /root/.cargo \
             && ! test -d /usr/local/cargo \
             && ! test -d /src'

      - name: Smoke test — modem artifact hashes match same-run downloads
        run: |
          set -euo pipefail
          default_expected="$(sha256sum .artifacts/modem-firmware/flash_image.bin | awk '{print $1}')"
          verbose_expected="$(sha256sum .artifacts/modem-firmware-verbose/flash_image.bin | awk '{print $1}')"
          read -r default_actual verbose_actual < <(
            docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
              'sha256sum /usr/local/share/sonde/firmware/modem/default/flash_image.bin /usr/local/share/sonde/firmware/modem/verbose/flash_image.bin | awk "{print \$1}" | paste -sd" " -'
          )
          test "$default_actual" = "$default_expected"
          test "$verbose_actual" = "$verbose_expected"

      - name: Smoke test — BPF artifact hashes match same-run downloads
        run: |
          set -euo pipefail
          (
            cd .artifacts/test-programs
            set -- *.o
            test -e "$1"
            sha256sum "$@" | while read -r sum file; do
              printf '%s %s\n' "$file" "$sum"
            done | sort
          ) > expected-hashes.txt
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }} -c \
            'cd /usr/local/share/sonde/test-programs
             set -- *.o
             test -e "$1"
             sha256sum "$@" | while read -r sum file; do
               printf "%s %s\n" "$file" "$sum"
             done | sort' > actual-hashes.txt
          diff -u expected-hashes.txt actual-hashes.txt

      # Push the per-arch image with a temporary tag (consumed by the
      # manifest job). Include the workflow run ID so overlapping runs
      # for the same commit cannot overwrite each other's temporary tags.
      # Public user-facing tags are only created after BOTH architectures pass.
      - name: Push per-arch image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          ARCH_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-${{ github.run_id }}-${{ matrix.arch }}"
          docker tag "${{ env.IMAGE_NAME }}:smoke-${{ matrix.arch }}" "$ARCH_TAG"
          docker push "$ARCH_TAG"

  # ── Combine per-arch images into a multi-arch manifest ────────────
  manifest:
    name: Publish multi-arch manifest
    needs: [build]
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v3

      - name: Determine tags
        id: tags
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          TAGS="sha-${SHORT_SHA}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${VERSION},latest"
          else
            DATE=$(date -u +%Y%m%d)
            TAGS="${TAGS},nightly,nightly-${DATE}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          AMD64="${BASE}:build-${{ github.sha }}-${{ github.run_id }}-amd64"
          ARM64="${BASE}:build-${{ github.sha }}-${{ github.run_id }}-arm64"

          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          for TAG in "${TAG_ARRAY[@]}"; do
            docker buildx imagetools create \
              --tag "${BASE}:${TAG}" \
              "${AMD64}" "${ARM64}"
          done

      - name: Clean up temporary per-arch tags
        run: |
          # Per-arch build tags are consumed; they will expire via GHCR
          # retention policy. No explicit deletion needed.
          echo "Manifest published successfully."
