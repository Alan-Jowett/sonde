[package]
name = "sonde-azure-companion"
edition = "2021"
version.workspace = true
license = "MIT"

[dependencies]
azure_core = { version = "0.25", default-features = false }
base64 = "0.22"
bollard = "0.21"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
httpdate = "1"
hyper-util = "0.1"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
regex = "1"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
p256 = { version = "0.13", features = ["pkcs8"] }
rcgen = { version = "0.14", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rsa = "0.9"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sonde-gateway = { path = "../sonde-gateway", default-features = false }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tracing = { version = "0.1", features = ["max_level_trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tar = "0.4"
thiserror = "2"
x509-cert = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_Threading"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
temp-env = "0.3"
tokio-stream = "0.1"
wiremock = "0.6"
