[package]
name = "sonde-admin"
version.workspace = true
edition = "2021"
license = "MIT"

[[bin]]
name = "sonde-admin"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
hex = "0.4"
hkdf = "0.12"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper-util = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tower = "0.5"
rpassword = "7.5.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sonde-protocol = { path = "../sonde-protocol", features = ["fingerprint"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1.8.2"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
sonde-gateway = { path = "../sonde-gateway" }

