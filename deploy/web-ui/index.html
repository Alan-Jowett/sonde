<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonde</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js" integrity="sha384-b0GXujLkk9eYYSmcSfoyZbfyElGAQnDyY0skCHSG6w3JgTMFnz11ggrTAr7seu9f" crossorigin="anonymous"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">Sonde</div>
      <div class="topbar-right">
        <span id="env-indicator" class="env-indicator" title="No environment selected"></span>
        <button type="button" class="env-gear-btn" id="env-gear-btn" title="Manage environments">⚙</button>
        <div id="auth-controls" class="auth-controls"></div>
      </div>
    </header>

    <nav class="tabs" aria-label="Primary">
      <button type="button" class="tab-button" data-tab="dashboard">Dashboard</button>
      <button type="button" class="tab-button" data-tab="desired-state">Desired State</button>
      <button type="button" class="tab-button" data-tab="programs">Programs</button>
      <button type="button" class="tab-button" data-tab="sensor-data">Sensor Data</button>
    </nav>

    <main id="content" class="content" tabindex="-1"></main>
  </div>
</body>
</html>
