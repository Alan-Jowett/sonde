[package]
name = "sonde-kiosk-ui"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Tauri v2 kiosk dashboard app for sonde"

[lib]
name = "sonde_kiosk_ui_backend"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
rcgen = { version = "0.14", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
time = "0.3"
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-cert = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
