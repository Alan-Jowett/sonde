[package]
name = "sonde-bpf"
version.workspace = true
edition = "2021"
description = "A simple, zero-allocation BPF interpreter based on RFC 9669"
license = "MIT"

[features]
default = [
    "std",
    "base32",
    "base64",
    "atomic32",
    "atomic64",
    "divmul32",
    "divmul64",
]
std = []
base32 = []
base64 = ["base32"]
atomic32 = ["base32"]
atomic64 = ["atomic32"]
divmul32 = ["base32"]
divmul64 = ["divmul32"]
# Reduce the interpreter stack to one frame and disable local BPF calls.
stack-512 = []

[[bin]]
name = "sonde_bpf_plugin"
required-features = ["std"]
